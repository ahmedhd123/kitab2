هذه ملاحظات تحسين سريعة ومنظمة بعد مراجعة المشروع:

أولويات عاجلة (سريعة الأثر)

إصلاحات تجميع في الصفحة الرئيسية: أكمل نصوص/ويدجت ناقصة في redesigned_home_screen:
داخل _buildReadingChallenges: هناك Text و Containers فارغة (قيم مفقودة للنصوص والعلامات).
داخل _buildSectionWithHeader: Text للسطرين title وsubtitle غير مكتملين.
توحيد صلاحيات الرفع/التعديل: استخرج منطق canUploadBooks إلى Auth/PermissionService واحد، واستخدمه في كل المواضع (FAB، تفاصيل الكتاب، الشاشة المخصصة للرفع).
القارئ PDF:
إضافة أوضاع القراءة المستقلة (فاتح/سبيا/داكن) بخيارات داخل القارئ تحفظ في Firestore لكل كتاب/مستخدم.
تنفيذ القفز للصفحة عبر شريط التمرير (onChangeEnd → jumpToPage) وحفظ التقدم.
القارئ EPUB:
إضافة التحكم بحجم الخط/تباعد الأسطر/هوامش الصفحة مع حفظ الإعدادات.
تهيئة Prefetch للفصل التالي لتقليل وقت الانتقال بالسحب.
البحث والتوصيات:
ربط “توصيات مخصصة” ببيانات حقيقية: ترجيح بحسب التصنيفات المقروءة والمراجعات والكتب المكتمَلة.
استبدال “الأكثر شعبية” بحساب ديناميكي (readsCount + reviewsCount + averageRating) مع فهارس Firestore مناسبة.
تحسين تجربة المستخدم

الغلاف والصور: استخدام cached_network_image مع Placeholder/Shimmer وفشل رشيق لصورة الغلاف.
القراءة دون اتصال: تفعيل Firestore persistence، وتنزيل الكتاب محلياً مع إدارة مساحة وتحقق سلامة الملف.
الحفظ التلقائي: حفظ تقدم القراءة على فواصل زمنية قصيرة وعند إغلاق الشاشة.
الوصولية: دعم تكبير النصوص، تباين ألوان قوي، وتسميات Semantics للعناصر التفاعلية.
هندسة الكود والجودة

النصوص: إزالة كل النصوص المضمنة واستبدالها بـ AppLocalizations *.arb (العربية أساساً) وتحضير i18n للغات لاحقاً.
Provider: فصل واضح بين UI والمنطق، وExposure لحالات التحميل/الخطأ لكل خدمة.
أخطاء واستثناءات: تطبيق try-catch مع رسائل عربية واضحة وسجل تقني إلى Crashlytics.
اختبارات:
وحدة لخدمات Book/Review/ReadingProgress.
Widget tests لبطاقات الكتب والقارئ.
CI/CD: إعداد GitHub Actions لبناء Flutter (Android/iOS/Web) وتشغيل الاختبارات؛ نشر Firebase Hosting للويب إن لزم.
التحليلات: Firebase Analytics لأحداث open_reader, page_turn, finish_book, create_challenge.
قواعد الأمان: مراجعة firestore.rules و storage.rules لتقييد تعديل الكتب للمالِك أو من لديه canUploadBooks؛ التحقق من نوع الملف وحجمه.
الأداء والبيانات

فهارس Firestore: إنشاء composite indexes للاستعلامات (تصنيف+شعبية، كتب المستخدم، المراجعات حسب الكتاب والتاريخ).
Pagination وInfinite scroll لقوائم الكتب/المراجعات.
Caching للبيانات الساخنة (آخر كتب، التريند) في الذاكرة مع TTL قصير عبر Provider.
ميزات اجتماعية وتحديات

التحديات: لوحة متصدرين (هذا الأسبوع/الشهر)، إشعارات تقدم، وتذكيرات عبر FCM.
المراجعات: ردود وتعليقات خفيفة، وتصفية حسب التقييم، وإبلاغ/إخفاء.
القوائم: قوائم قراءة عامة/خاصة مع مشاركة رابط.
توافق المنصات

الويب: التأكد من بدائل PDF/EPUB على الويب (pdfx/webview إن لزم) ورسائل واضحة حين لا يُدعم تنسيق على منصة معينة.
iOS/Android: مراجعة الأذونات، سياسة الخلفية للتحميل، وProGuard/R8.
ملاحظات محددة على الكود الحالي

redesigned_home_screen:
أكمل عناصر النصوص المفقودة في _buildReadingChallenges و _buildSectionWithHeader لتجنب أخطاء التجميع.
اجعل “الأكثر شعبية” تعتمد على خدمة تُعيد ترتيب الكتب بدل take(5).
اجمع ActionChip للاقتراحات من مصدر مركزي (فئات BookService) بدل السلاسل الثابتة.
القارئ:
توحيد حفظ التقدم بين PDF/EPUB بنفس الواجهة في BookService.
إضافة شريط أدوات عائم للقفز للصفحة/الفصل وتبديل الوضع.
إن رغبت، أنفذ الآن:

إصلاحات الصفحة الرئيسية غير المكتملة.
أوضاع القارئ PDF + القفز للصفحة.
خدمة Permissions مركزية واستخدامها في كل المكان.
