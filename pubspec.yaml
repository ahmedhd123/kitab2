name: kitab2
description: "تطبيق لقراءة الكتب الإلكترونية وتقييمها ومراجعتها"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0' # تحديث ليتوافق مع نسخة Dart الحالية (3.6.0)

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  # Firebase core + الخدمات المستخدمة في المشروع (مصادقة + قاعدة بيانات سحابية)
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.7.0
  # قارئ PDF
  flutter_pdfview: ^1.2.7
  pdfx: ^2.6.0
  # عارض PDF يدعم الويب (Syncfusion)
  # تم تعليق الاعتماد على syncfusion_flutter_pdfviewer مؤقتاً بسبب تعارض intl
  # syncfusion_flutter_pdfviewer: ^28.2.7
  # EPUB parsing and in-app rendering
  # (removed experimental packages to keep dependency resolution stable)
  # للوصول إلى المسارات المحلية (مستخدم بالفعل في قارئ الكتب)
  path_provider: ^2.1.3
  # مشاركة الكتاب (مطلوبة لميزة المشاركة TODO)
  share_plus: ^10.0.0
  webview_flutter: ^4.13.0
  epubx: ^4.0.0
  # File picker for selecting PDF/EPUB from device
  file_picker: ^5.2.5
  http: ^1.2.1
  # Collection utilities
  collection: ^1.19.0
  # Archive utilities for file compression
  archive: ^3.6.1
  # Cached images مع Placeholder/Cache
  cached_network_image: ^3.3.1
  # فتح الروابط الخارجية (لافتة فهارس Firestore)
  url_launcher: ^6.3.0
  # إبقاء الشاشة قيد التشغيل أثناء القراءة
  wakelock_plus: ^1.2.5
  # التحكم في سطوع الشاشة داخل القارئ
  screen_brightness: ^0.2.2

  # (اختياري لاحقاً) للتنسيق الدولي للتواريخ والأرقام
  # intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # مجلدات الموارد (أضف الملفات الفعلية لاحقاً داخل هذه المسارات)
    - assets/books/
    - assets/images/
    # تأكد من إنشاء هذه المجلدات وإضافة ملفات PDF و صور أغلفة الكتب
  # fonts مفرغة مؤقتاً حتى إضافة ملفات الخط فعلياً
  fonts: []

  # إعدادات الترجمة التلقائية
  # يستخدم flutter gen-l10n هذه الإعدادات لتوليد AppLocalizations
  # سنفترض ملفات arb موجودة تحت lib/l10n
  # default locale: ar
  # لتشغيل التوليد: flutter gen-l10n (يعمل تلقائياً مع build/run)
  # ملاحظة: VS Code سيولد تلقائياً عند تشغيل التطبيق
  # l10n:
  #   arb-dir: lib/l10n
  #   template-arb-file: app_ar.arb
  #   output-localization-file: app_localizations.dart
  #   output-class: AppLocalizations
  #   preferred-supported-locales: [ar, en]
